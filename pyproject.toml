[project]
name = "agex-ui"
version = "0.0.1"
description = "Agent-driven user interfaces with agex and NiceGUI."
authors = [{ name = "ashenfad"}]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nicegui",
    "plotly",
    "kaleido", # for exporting plotly figures
    "numpy",
    "pandas",
    "markdown",
    "pygments", # for syntax highlighting
    "diff-match-patch", # for inline diff highlighting
    "agex[gemini]>=0.9.0",
    "calgebra[google-calendar,ical]>=0.10.3",
    "sandtrap>=0.1.7",
    "marimo>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "uv"
]

[tool.setuptools]
packages = {find = {where = ["./"], exclude = ["tests*", "build*"]}}  # Discover packages, exclude tests/examples

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
